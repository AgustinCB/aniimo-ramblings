{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  <h2>Latest guides</h2>
  <ul class="post-list">
    {{ range first 10 (where site.RegularPages "Section" "guides") }}
      <li>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
      </li>
    {{ else }}
      <li>No guides published yet.</li>
    {{ end }}
  </ul>
{{ end }}
