{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  <ul class="post-list">
    {{ range .Pages }}
      <li>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
        {{ with .Description }}<p>{{ . }}</p>{{ end }}
      </li>
    {{ else }}
      <li>Nothing here yet.</li>
    {{ end }}
  </ul>
{{ end }}
