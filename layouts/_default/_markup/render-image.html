{{- $src := .Destination -}}
{{- if hasPrefix $src "/" -}}
  {{- $src = path.Join (urls.Parse site.BaseURL).Path $src -}}
{{- end -}}
{{- $class := cond (hasPrefix .Destination "/images/aniimo/") "aniimo-portrait" "figure-image" -}}
<img class="{{ $class }}" src="{{ $src }}" alt="{{ .Text }}"{{ with .Title }} title="{{ . }}"{{ end }} loading="lazy">
